<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="丁杨的项目作品集，涵盖人像视频生成、实时流式人像与视频编辑方向。">
  <title>丁杨 · 项目作品集</title>
  <style>
    :root{color-scheme:light;--ink:#17202b;--muted:#657181;--line:#e5e9ee;--accent:#3157a4;--paper:#f7f8fa;--white:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif}
    main{width:min(940px,calc(100% - 40px));margin:0 auto;padding:76px 0 64px}.eyebrow{font-size:12px;letter-spacing:.17em;text-transform:uppercase;color:var(--accent);font-weight:700}
    h1{font-size:clamp(36px,6vw,58px);line-height:1.12;letter-spacing:-.04em;margin:18px 0 16px}.intro{max-width:650px;color:var(--muted);font-size:18px;margin:0 0 44px}
    .list{border-top:1px solid var(--line)}a.project{display:grid;grid-template-columns:64px 1fr auto;gap:20px;align-items:center;text-decoration:none;color:inherit;background:var(--white);border-bottom:1px solid var(--line);padding:23px 22px;transition:background .18s,transform .18s}
    a.project:hover{background:#f0f4fb;transform:translateX(4px)}.num{font-size:13px;color:#8b96a4;font-variant-numeric:tabular-nums}.title{font-size:20px;font-weight:650;letter-spacing:-.02em}.desc{color:var(--muted);font-size:14px;margin-top:3px}.arrow{font-size:22px;color:var(--accent)}footer{margin-top:30px;color:#8a94a1;font-size:13px}
    @media(max-width:600px){main{padding-top:48px}a.project{grid-template-columns:34px 1fr auto;gap:12px;padding:18px 14px}.title{font-size:17px}.intro{font-size:16px}}
  </style>
</head>
<body><main>
  <div class="eyebrow">PROJECT PORTFOLIO</div>
  <h1>项目作品集</h1>
  <p class="intro">围绕人像视频生成、实时音视频与视频内容编辑的项目介绍。选择一个项目，查看对应页面。</p>
  <div class="list">
    <a class="project" href="https://dypromise.github.io/human-video-generation/"><span class="num">01</span><span><span class="title">人像视频生成</span><span class="desc">人像外观、动作表现与视频连贯性</span></span><span class="arrow">↗</span></a>
    <a class="project" href="https://dypromise.github.io/multimodal-human-video/"><span class="num">02</span><span><span class="title">多模态人像视频生成</span><span class="desc">多种条件协同驱动的人像内容生成</span></span><span class="arrow">↗</span></a>
    <a class="project" href="https://dypromise.github.io/real-time-avatar/"><span class="num">03</span><span><span class="title">实时流式人像</span><span class="desc">低延迟交互下的连续音视频生成</span></span><span class="arrow">↗</span></a>
    <a class="project" href="https://dypromise.github.io/video-subtitle-removal/"><span class="num">04</span><span><span class="title">视频字幕擦除</span><span class="desc">动态画面中文字区域的内容修复</span></span><span class="arrow">↗</span></a>
    <a class="project" href="https://dypromise.github.io/product-motion-video/"><span class="num">05</span><span><span class="title">商品微动视频</span><span class="desc">静态商品素材到轻动态视频的转化</span></span><span class="arrow">↗</span></a>
    <a class="project" href="https://dypromise.github.io/audio-driven-lip-sync/"><span class="num">06</span><span><span class="title">视频口型同步</span><span class="desc">语音与人物口型、画面时序的匹配</span></span><span class="arrow">↗</span></a>
  </div>
  <footer>丁杨 · 个人项目目录</footer>
</main></body></html>
